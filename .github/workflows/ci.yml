name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check version agreement
        run: npm run check:versions

      - name: Run test suite
        run: npm test

      - name: Run typecheck
        run: npm run typecheck

      - name: Run linter
        run: npx eslint src test

      - name: Package plugin
        run: npm run package
