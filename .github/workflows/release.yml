name: Release

# Obsidian resolves a plugin version by looking for a GitHub release whose TAG
# IS THE BARE VERSION -- 1.2.0, never v1.2.0 -- and by reading the three files
# attached to it as individual assets. The community installer downloads those
# assets; it never reads the repository tree. That is why `main.js` and
# `styles.css` are gitignored and built here instead of committed: a copy in git
# would go stale the first commit after someone edited a part file.
#
# ── A RELEASE IS A MINOR OR A MAJOR, NEVER A PATCH (1.0.0) ────────────────
#
# The trigger below still matches every three-part tag, and the FIRST STEP
# refuses the ones that do not end in `.0`.
#
# NARROWING THE PATTERN TO `[0-9]+.[0-9]+.0` WAS THE SHORTER ROUTE AND IS THE
# WRONG ONE. A patch tag would then start nothing at all, and a workflow that
# never ran is indistinguishable, on the Actions page, from one that ran and
# decided to do nothing. A tag is something a person wrote down meaning it, so
# it gets an answer. This repository refuses rather than ignores everywhere the
# choice comes up -- `row: 3`, `tab: Charts`, a `cell` outside a row -- and a
# tag naming a version that will not be released is the same kind of mistake.
#
# WHERE A PATCH GOES INSTEAD, because it does not go nowhere. `latest.yml`
# republishes the rolling `latest` release on EVERY version change, patches
# included, so a patch build is downloadable from a permanent address the
# moment it lands on the default branch. What it does not get is a numbered
# release and a line in `versions.json` -- and that pair is what Obsidian's
# installer resolves, so a patch reaches whoever follows the rolling link and
# reaches everyone else in the next minor.
#
# AND THIS WORKFLOW PUBLISHES THE ROLLING RELEASE FOR ITS OWN VERSION, at the
# end, through `.github/actions/rolling-release`. `latest.yml` handles patches
# and declines everything else, so without the tail below the three `latest`
# addresses in the README would serve the previous minor's last patch build for
# as long as the new minor went without one -- a real build, downloading fine,
# silently a version old. Doing it here rather than there is also what keeps the
# full suite running ONCE per version: this job has already checked out,
# installed and passed everything by the time it gets there.
#
# THE LEDGER SAYS THE SAME THING FROM THE OTHER SIDE. `versions.json` lists
# what a store install may resolve, so under this policy it holds minor and
# major versions only; `test/workflows.test.ts` sweeps it for a patch key. Two
# guards rather than one, because they fail at different moments: the sweep
# fails on the commit that adds the key, and the step below fails on the tag.
# That same test RUNS the step below against six tags rather than reading it --
# the only test in the suite that starts a process, and the argument is in the
# comment on it: the difference between a right and a wrong way to spell this
# question is invisible to any assertion that only reads the script.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      # FIRST, AND AHEAD OF THE CHECKOUT. This reads nothing but the ref name,
      # so a patch tag costs a runner start and stops there: no clone, no
      # `npm ci`, no test run. It is the argument the two checks below make
      # about sitting ahead of the composite, taken one step further because
      # this one needs no files at all.
      #
      # `${tag##*.}` IS THE PATCH COMPONENT, and it is asked for rather than
      # glob-matched. A `case "$tag" in *.0)` reads the same and is not the
      # same: `1.0.10` ends in a zero, does not end in `.0`, and is a patch --
      # which the glob happens to get right and gets right by accident. The
      # trigger guarantees three numeric components, so the last one is the
      # whole question.
      - name: Refuse a patch version
        run: |
          tag="$GITHUB_REF_NAME"
          patch="${tag##*.}"
          if [ "$patch" != "0" ]; then
            printf '### Not a release\n\n' >> "$GITHUB_STEP_SUMMARY"
            printf '**%s** is a patch version, and this repository publishes a numbered release on minor and major versions only.\n\n' "$tag" >> "$GITHUB_STEP_SUMMARY"
            printf 'The build is already attached to the rolling **latest** release, which republishes on every version change. Delete the tag with `git push --delete origin %s` and let the next minor carry the fix.\n' "$tag" >> "$GITHUB_STEP_SUMMARY"
            echo "$tag is a patch version; releases are minor or major only."
            exit 1
          fi
          echo "$tag is a release version."

      - name: Checkout repository
        uses: actions/checkout@v4

      # THE TAG IS THE VERSION, so a tag that disagrees with the manifest would
      # publish a release advertising one number containing a build that calls
      # itself another, and Obsidian believes the manifest.
      #
      # AHEAD OF THE COMPOSITE ON PURPOSE. This and the check below read JSON
      # with the Node the runner already ships, so neither needs `npm ci` — and
      # asking them first is what makes a mistyped tag cost seconds rather than
      # an install and a full test run.
      - name: Check the tag against the manifest
        run: |
          tag="$GITHUB_REF_NAME"
          manifest=$(node -p "require('./manifest.json').version")
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$manifest" ] || [ "$tag" != "$pkg" ]; then
            echo "tag '$tag' disagrees with manifest '$manifest' / package '$pkg'"
            exit 1
          fi

      # `check:versions` deliberately tolerates a version that is not yet in
      # versions.json -- that is what a testing build looks like. A release is
      # the one moment where it must be there, because versions.json is how
      # Obsidian picks a build for a given app version.
      - name: Require the version in versions.json
        run: |
          tag="$GITHUB_REF_NAME"
          node -e "
            const v = require('./versions.json');
            const tag = process.argv[1];
            if (!v[tag]) {
              console.error('versions.json has no entry for ' + tag);
              process.exit(1);
            }
          " "$tag"

      # The same four checks CI and the rolling release run, from one place.
      - name: Install and check
        uses: ./.github/actions/checks

      # `package`, NOT `build`. The numbered release needs only the three loose
      # files, and `npm run build` is what produces those -- but the rolling
      # release published at the end of this job carries the plugin FOLDER as a
      # zip, and `tools/archive.mjs` zips `dist/`, which is what packaging lays
      # out and verifies.
      - name: Build
        run: npm run package

      # The installer writes exactly these three files and creates no
      # subdirectories. A zero-byte styles.css would install silently and render
      # an unstyled plugin, so each is checked for size, not just existence.
      - name: Verify the release assets
        run: |
          for f in main.js manifest.json styles.css; do
            if [ ! -s "$f" ]; then
              echo "missing or empty release asset: $f"
              exit 1
            fi
            echo "$f  $(wc -c < "$f") bytes"
          done

      # Release notes come from the changelog section for this version, so the
      # release page says what the CHANGELOG says rather than a list of commit
      # subjects. If the section is missing the release still goes out, pointing
      # at the file -- a missing heading is not a reason to fail a tagged build.
      - name: Extract the changelog section
        run: |
          tag="$GITHUB_REF_NAME"
          awk -v tag="$tag" '
            $0 ~ "^## \\[" tag "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            printf 'See [CHANGELOG.md](CHANGELOG.md) for the notes on %s.\n' "$tag" > release-notes.md
          fi

      - name: Create the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            main.js manifest.json styles.css

      # LAST, AND AFTER THE NUMBERED RELEASE EXISTS. This one moves a tag and
      # overwrites assets on a release readers have bookmarked, so it goes after
      # the step that cannot be undone by re-running the job -- if creating the
      # numbered release fails, `latest` has not been moved onto a version that
      # has no release behind it.
      - name: Publish the rolling release
        uses: ./.github/actions/rolling-release
        with:
          version: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
